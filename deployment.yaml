apiVersion: apps/v1
kind: Deployment
metadata:
  name: ewaste-portal-deployment
  labels:
    app: ewaste-portal
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ewaste-portal
  template:
    metadata:
      labels:
        app: ewaste-portal
    spec:
      containers:
      - name: ewaste-portal-container
        image: dilip087/e-waste-collection-recycling-portal:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ewaste-portal-service
spec:
  type: NodePort
  selector:
    app: ewaste-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
